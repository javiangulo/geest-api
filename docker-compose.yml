services:
  geest-api:
    container_name: geest-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=5500
      - NODE_ENV=production
      - DB_PROVIDER=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=geest_db
    ports:
      - '${PORT:-5500}:5500'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - geest-network

  postgres:
    image: postgres:16-alpine
    container_name: geest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-geest_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-geest_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - geest-network

volumes:
  postgres_data:
    driver: local

networks:
  geest-network:
    driver: bridge
